<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#f8f8f6" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#0c0d0f" media="(prefers-color-scheme: dark)" />
    <meta name="description" content="An interactive fretboard guide for guitarists who know the basics but still get lost on the neck." />
    <title>Neckline</title>
    <link rel="preload" href="/src/assets/fonts/instrument-sans.woff2" as="font" type="font/woff2" crossorigin />
    <link rel="preload" href="/src/assets/fonts/geist-mono.woff2" as="font" type="font/woff2" crossorigin />
    <link rel="preload" href="/src/assets/fonts/music-accidentals.woff2" as="font" type="font/woff2" crossorigin />
    <script>
      try {
        var t = JSON.parse(localStorage.getItem('neckline:prefs') || '{}').theme;
        if (t === 'dark' || (t !== 'light' && matchMedia('(prefers-color-scheme: dark)').matches)) document.documentElement.classList.add('dark');
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
